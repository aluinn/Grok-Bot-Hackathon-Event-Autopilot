<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="template.css">
  <style>
    /* Story 1080x1920 (extra space top and bottom so nothing hides behind app buttons) */
    html, body { width: 1080px; height: 1920px; }
    body { --pad: 90px; --bar: 24px; --small: 36px; --name: 120px; --name-max: 760px; --body: 52px; --venue-max: 200px; --hosts-max: 140px; --badge: 52px; --gap: 48px; padding-left: 114px; padding-top: 220px; padding-bottom: 260px; }
  </style>
</head>
<body>
  <div class="tag">You're invited</div>
  <div class="main">
    <div class="name" data-fit>{{NAME}}</div>
    {{WHEN}}
    {{VENUE}}
    {{HOSTS}}
  </div>
  <div class="footer">{{BADGE}}</div>
  <script src="fit.js"></script>
</body>
</html>

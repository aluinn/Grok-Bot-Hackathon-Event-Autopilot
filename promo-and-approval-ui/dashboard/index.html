<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0B0B0F">
  <link rel="icon" href="data:,">
  <title>Event Autopilot: Approve</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Top bar: always visible. The trust message and the progress never leave the screen. -->
  <nav class="nav">
    <div class="nav-left">
      <a class="brand" href="/">Event Autopilot<span class="dot"></span></a>
      <div class="tabs">
        <a class="tab" href="/launch.html">Launch</a>
        <a class="tab active" href="/" aria-current="page">Review</a>
        <a class="tab" href="/digest.html"><span class="wk">Weekly </span>digest</a>
      </div>
    </div>
    <div class="trust">Nothing is sent until you approve it.</div>
    <div class="nav-progress">
      <span id="progress-label">0 of 6 approved</span>
      <div class="bar"><div class="bar-fill" id="bar-fill"></div></div>
    </div>
  </nav>

  <!-- Intro: tall on purpose. As you scroll through it, the 3D images fly toward you. -->
  <section class="hero" id="hero">
    <div class="hero-sticky">
      <div class="hero-text" id="hero-text">
        <p class="eyebrow">Review and approve</p>
        <h1 id="event-name">&nbsp;</h1>
        <div class="chips" id="event-chips"></div>
      </div>

      <div class="scene"><div class="stage" id="stage"></div></div>

      <!-- Fades in at the end of the fly-through, as the images dissolve -->
      <div class="hero-end" id="hero-end">
        <h2 class="section-title">Everything we made for you</h2>
        <p class="section-sub">Read each card. Edit it if you like. Approve it when it's right.</p>
      </div>

      <a class="scroll-hint" id="scroll-hint" href="#cards">Scroll to review <span class="arrow">&#8595;</span></a>
    </div>
  </section>

  <main class="review">
    <!-- Left: a sticky checklist (built by app.js) -->
    <aside class="rail" id="rail" aria-label="Checklist"></aside>

    <!-- Right: the items to review -->
    <div>
      <section id="cards"></section>

      <section class="done" id="done">
        <span class="done-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>
        <div>
          <h2>All items approved</h2>
          <p>Everything has your OK.</p>
        </div>
      </section>
    </div>
  </main>

  <script src="app.js"></script>

  <!-- The Autopilot assistant: a floating chat in the bottom-left corner (see assistant/README.md) -->
  <link rel="stylesheet" href="/assistant/assistant.css">
  <script src="/assistant/assistant.js"></script>
</body>
</html>
